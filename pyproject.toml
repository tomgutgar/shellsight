[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shellsight"
version = "0.1.0"
description = "See what a shell snippet reads, writes or executes before you run it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
shellsight = "shellsight:main"

[tool.setuptools]
py-modules = ["shellsight"]
